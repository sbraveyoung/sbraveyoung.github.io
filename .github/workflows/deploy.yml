name: Deploy

on:
  push:
    branches: [master]
    paths: [.github/workflows/deploy.yml, _gobog.json, 'scripts/**']
  repository_dispatch:
    types: [blog-update]
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme override; empty uses _gobog.json'
        required: false
        default: ''

concurrency:
  group: gobog-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      gobog_ref: ${{ steps.cfg.outputs.gobog_ref }}
    steps:
      - name: Checkout site configuration
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Read configuration
        id: cfg
        env:
          THEME_OVERRIDE: ${{ inputs.theme }}
        run: python3 scripts/render-config.py
      - name: Require private source credential
        env:
          BLOG_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$BLOG_TOKEN" ]; then
            echo '::error::GH_PAT must have Contents: Read on the private sbraveyoung/blog repository.'
            exit 1
          fi
      - name: Checkout private Markdown source
        uses: actions/checkout@v4
        with:
          repository: sbraveyoung/blog
          ref: master
          path: _blog
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      - name: Checkout pinned gobog
        uses: actions/checkout@v4
        with:
          repository: sbraveyoung/gobog
          ref: ${{ steps.cfg.outputs.gobog_ref }}
          path: _gobog
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: _gobog/go.mod
          cache-dependency-path: _gobog/go.sum
      - name: Test and build renderer
        working-directory: _gobog
        run: |
          go test ./src/...
          mkdir -p ../_bin
          go build -o ../_bin/gobog ./src
      - name: Resolve source revision
        id: source
        run: echo "sha=$(git -C _blog rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Render public site
        run: ./_bin/gobog -config _gobog.toml -export _dist
      - name: Check rendered links and assets
        run: python3 scripts/check-export.py _dist
      - name: Build search index
        run: npx --yes pagefind@1.3.0 --site _dist
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _dist
      - name: Commit generated site
        env:
          BLOG_SHA: ${{ steps.source.outputs.sha }}
          GOBOG_SHA: ${{ steps.cfg.outputs.gobog_ref }}
          THEME: ${{ steps.cfg.outputs.theme }}
        run: |
          # Remove only tracked generated output. Preserve source configuration.
          git ls-files -z | python3 -c 'import sys,subprocess; paths=[p.decode() for p in sys.stdin.buffer.read().split(b"\0") if p]; paths=[p for p in paths if not p.startswith((".github/","scripts/","docs/")) and p!="_gobog.json"]; subprocess.run(["git","rm","--ignore-unmatch","--",*paths],check=True) if paths else None'
          cp -a _dist/. .
          git add -A -- . ':!_blog' ':!_gobog' ':!_bin' ':!_dist' ':!_data' ':!_gobog.toml'
          if ! git diff --cached --quiet; then
            git config user.name gobog-deploy
            git config user.email gobog-deploy@users.noreply.github.com
            git commit -m "deploy: theme=$THEME blog=$BLOG_SHA gobog=$GOBOG_SHA"
            git push origin HEAD:master
          fi
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
